
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción</title>
</head>

<body>

    <form action="procesar.php" method="post" enctype="multipart/form-data"
        oninput="salida.value = nivel.value">

        <input type="hidden" name="ref_interna" value="DIW-7K2">

        <fieldset id="grupo-sigma">
            <legend>Datos Personales</legend>

            <label for="name">Nombre: </label>
            <input type="text" name="name" id="name" minlength="2" maxlength="40" autofocus required>

            <br><br>

            <label for="surname">Apellidos: </label>
            <input type="text" name="surname" id="surname" maxlength="60" required>

            <br><br>

            <label for="dni_nie">DNI/NIE: </label>
            <input type="text" name="dni_nie" id="dni_nie"
                placeholder="12345678A / X1234567B"
                pattern="([0-9]{8}[A-Z]|[X-Z][0-9]{7}[A-Z])" required>

            <br><br>

            <label for="birthday">Fecha de nacimiento: </label>
            <input type="date" name="birthday" id="birthday"
                min="1960-01-01" max="2010-12-31" required>

            <br><br>

            <label for="email">Correo electrónico: </label>
            <input type="email" name="email" id="email"
                autocomplete="email" required>

            <br><br>

            <label for="number">Número de teléfono: </label>
            <input type="tel" name="number" id="number"
                pattern="[67][0-9]{8}" maxlength="9">

            <br><br>

            <label for="postcode">Código postal: </label>
            <input type="text" name="postcode" id="postcode"
                pattern="(35|38)[0-9]{3}" maxlength="5" required>

            <br><br>

            <label for="town">Municipio: </label>
            <input type="text" name="town" id="town" list="town_list">

            <datalist id="town_list">
                <option value="Adeje">
                <option value="Arona">
                <option value="Granadilla de Abona">
                <option value="San Miguel de Abona">
                <option value="Santa Cruz de Tenerife">
                <option value="San Cristóbal de La Laguna">
            </datalist>

        </fieldset>


        <fieldset>
            <legend>Cuenta de acceso</legend>

            <label for="username">Nombre de usuario: </label>
            <input type="text" name="username" id="username"
                pattern="[a-z][a-z0-9]{4,11}"
                minlength="5" maxlength="12" required>

            <br><br>

            <label for="password">Contraseña: </label>
            <input type="password" name="password" id="password"
                minlength="8"
                pattern="(?=.*[0-9])[a-zA-Z0-9]+"
                autocomplete="new-password" required>

            <br><br>

            <label for="repeat_password">Repetir contraseña: </label>
            <input type="password" name="repeat_password" id="repeat_password"
                minlength="8"
                pattern="(?=.*[0-9])[a-zA-Z0-9]+"
                autocomplete="new-password" required>

        </fieldset>


        <fieldset>
            <legend>Taller</legend>

            <label for="taller">Taller: </label>
            <select name="taller" id="taller" required>

                <option value="" selected disabled>— Elige un taller —</option>

                <optgroup label="Iniciación">
                    <option value="html">Introducción a HTML</option>
                    <option value="figma">Diseño con Figma</option>
                    <option value="primera-web">Tu primera web</option>
                </optgroup>

                <optgroup label="Avanzado">
                    <option value="accesibilidad">Accesibilidad Web</option>
                    <option value="form_validations">Formularios y Validación</option>
                    <option value="git">Git para equipos</option>
                </optgroup>

            </select>

            <br><br>

            <label for="modalidad">Modalidad: </label>
            <select name="modalidad" id="modalidad">
                <option value="presencial" selected>Presencial</option>
                <option value="online">Online</option>
                <option value="hibrida">Híbrida</option>
            </select>

            <br><br>

            <label for="intereses">Intereses: </label>
            <select name="intereses[]" id="intereses" multiple>
                <option value="frontend">Frontend</option>
                <option value="backend">Backend</option>
                <option value="diseno">Diseño UX/UI</option>
                <option value="ciberseguridad">Ciberseguridad</option>
            </select>

            <br><br>

            <label for="nivel">Nivel de experiencia: </label>
            <input type="range" name="nivel" id="nivel"
                min="0" max="10" step="1" value="3">

            <output id="salida" for="nivel">3</output>

            <br><br>

            <label for="lenguaje_favorito">Lenguaje favorito: </label>
            <input type="text" name="lenguaje_favorito" id="lenguaje_favorito"
                list="lenguaje_list">

            <datalist id="lenguaje_list">
                <option value="HTML">
                <option value="CSS">
                <option value="JavaScript">
                <option value="Python">
                <option value="PHP">
                <option value="Java">
            </datalist>

            <br><br>

            <label for="color">Color: </label>
            <input type="color" name="color" id="color" value="#1b9e85">

            <br><br>

            <label for="imagen">Foto para acreditación: </label>
            <input type="file" name="imagen" id="imagen"
                accept="image/*" required>

            <br><br>

            <label for="acompaniantes">Acompañantes: </label>
            <input type="number" name="acompaniantes" id="acompaniantes"
                min="0" max="3" step="1" value="0">

            <br><br>

            <label for="portfolio">Portfolio: </label>
            <input type="url" name="portfolio" id="portfolio"
                placeholder="https://…">

            <br><br>

            <label for="comentarios">Comentarios: </label>
            <textarea name="comentarios" id="comentarios"
                rows="4" maxlength="300"
                placeholder="Añade tus comentarios"></textarea>

        </fieldset>


        <fieldset>
            <legend>Datos de control</legend>

            <label for="codigo_seguridad">Código de solicitud: </label>
            <input type="text" name="codigo_seguridad" id="codigo_seguridad"
                value="JT-0001" readonly>

            <br><br>

            <label for="descuento">Descuento aplicado: </label>
            <input type="text" name="descuento" id="descuento"
                value="0 %" disabled>

            <input type="hidden" name="edicion" value="JT-2027">

            <br><br>

            <input type="checkbox" name="aceptar_normas" id="aceptar_normas" required>
            <label for="aceptar_normas">Acepto las normas</label>

        </fieldset>

        <button type="submit">Enviar</button>
        <button type="reset" accesskey="q">Restablecer</button>
        <button type="button">Guardar borrador</button>

    </form>


    <!--
    PREGUNTAS

    1. Explica la expresión regular de la contraseña.

    (?=.*[0-9])[a-zA-Z0-9]+

    (?=.*[0-9]): obliga a que exista al menos un número.
    [a-zA-Z0-9]: permite letras mayúsculas, minúsculas y números.
    +: indica que debe existir uno o más caracteres.
    minlength="8": establece un mínimo de 8 caracteres.

    2. ¿Por qué HTML no puede garantizar que las contraseñas coincidan?

    Porque HTML valida cada campo individualmente, pero no puede comparar
    directamente el contenido de dos campos. Haría falta JavaScript
    para comprobar que ambos valores sean iguales.

    3. ¿Qué campos de Datos de control llegan al servidor?

    codigo_seguridad sí se envía porque utiliza readonly.
    descuento no se envía porque utiliza disabled.
    edicion sí se envía porque es un campo hidden.
    aceptar_normas se envía si está marcado.

    4. ¿Por qué la validación HTML no sustituye a la del servidor?

    Porque la validación del navegador puede modificarse o evitarse.
    El servidor debe comprobar nuevamente los datos recibidos para
    garantizar su seguridad y validez.

    5. ¿Qué significa el atributo enctype?

    Define cómo se codifican los datos del formulario al enviarlos.
    multipart/form-data permite enviar archivos junto con otros datos.

    -->


</body>
</html>
